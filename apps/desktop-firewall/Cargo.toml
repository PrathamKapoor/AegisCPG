# AegisCPG desktop firewall -- native CLI engine.
#
# Author: Pratham Kapoor <prathamkapoor027@gmail.com>
# https://github.com/PrathamKapoor
#
# WHAT:  `aegis-desktop-firewall.exe`, the engine of the desktop firewall:
#        discover | wrap | unwrap | verify-config | status. The Tauri tray in
#        `gui/` is a front-end for exactly these operations.
# WHY:   The `tauri` crate cannot be fetched on this air-gapped host, so the
#        tray shell (gui/) cannot be built here. The wrap rewrite, the
#        SHA-256-verified restore and the verification verdict are the parts
#        that can be wrong, so they live in a plain workspace binary that is
#        compiled, executed and tested on this host; the shell adds the tray
#        icon, not the logic.
# HOW:   No argument-parsing dependency, key=value output, meaningful exit
#        codes (0 clean, 1 refused/not verified, 2 usage error) so
#        `verify-config` is usable as a CI gate. All decisions delegate to
#        `crates/aegis-desktop-core`, which carries the unit tests.

[package]
name = "aegis-desktop-firewall"
description = "AegisCPG native desktop stdio MCP server firewall: wrap servers through the gateway with SHA-256 verified restore."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "aegis-desktop-firewall"
path = "src/main.rs"

[dependencies]
aegis-desktop-core.workspace = true
serde_json.workspace = true
