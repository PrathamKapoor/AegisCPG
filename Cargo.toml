# AegisCPG workspace manifest.
#
# Author: Pratham Kapoor <prathamkapoor027@gmail.com>
# https://github.com/PrathamKapoor
#
# WHAT:   Root Cargo workspace for the AegisCPG crates.
# WHY:    One workspace, one lockfile, one `cargo test --workspace` gate. A
#         verifier whose crates can be built independently can also be
#         version-skewed independently, and a hash pinned by one crate is
#         meaningless to another.
# HOW:    Path dependencies only. No git or registry self-references, so the
#         workspace builds offline once crates.io deps are vendored, and no
#         dependency can phone home at build time (ADR-001).

[workspace]
resolver = "2"
members = [
    "crates/aegis-common",
    "crates/aegis-dtg-parser",
    "crates/aegis-smt-verifier",
    "crates/aegis-ebpf-loader",
    "crates/aegis-proxy-gateway",
    "crates/aegis-cli",
    "crates/aegis-desktop-core",
    "apps/desktop-firewall",
]

# The portable toolchain bootstrap, the Tauri tray shell, and the non-Rust
# front-ends are never workspace members. `apps/desktop-firewall/gui` depends
# on the `tauri` crate, which is not vendored and cannot be fetched on this
# air-gapped host; listing it would make `cargo test --workspace` fail for
# every contributor for the sake of one optional binary. The tray's engine --
# discovery, wrapping, SHA-256-verified restore -- is the workspace member
# `apps/desktop-firewall` (binary `aegis-desktop-firewall`) plus
# `crates/aegis-desktop-core`, both of which are built and executed by the
# test suite on this host.
exclude = [
    ".toolchain",
    "target",
    "apps/mobile-approver",
    "apps/web-portal",
    "apps/desktop-firewall/gui",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
authors = ["Pratham Kapoor <prathamkapoor027@gmail.com>"]
repository = "https://github.com/PrathamKapoor/AegisCPG"
homepage = "https://github.com/PrathamKapoor"
keywords = [
    "mcp",
    "a2a",
    "formal-verification",
    "ebpf",
    "zero-llm",
    "static-analysis",
]
categories = ["security", "development-tools::debugging"]

[workspace.dependencies]
# --- Internal ---------------------------------------------------------------
aegis-common = { path = "crates/aegis-common", version = "1.0.0" }
aegis-dtg-parser = { path = "crates/aegis-dtg-parser", version = "1.0.0" }
aegis-smt-verifier = { path = "crates/aegis-smt-verifier", version = "1.0.0" }
aegis-ebpf-loader = { path = "crates/aegis-ebpf-loader", version = "1.0.0" }
aegis-proxy-gateway = { path = "crates/aegis-proxy-gateway", version = "1.0.0" }
aegis-desktop-core = { path = "crates/aegis-desktop-core", version = "1.0.0" }

# --- Serialisation ----------------------------------------------------------
# `float_roundtrip` makes the JSON float parser correctly rounded (Lemire's
# algorithm + fallback). Without it the fast path is off by up to one f64 ulp
# on 17-digit literals, which the parity gate's 1e-6 bound would still forgive
# but a canonical-hash check could not: a verifier that re-parses a document
# must read back the exact f64 the signer hashed.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }

# --- Hashing / signatures ---------------------------------------------------
sha2 = "0.10"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std"] }
pkcs8 = { version = "0.10", features = ["pem", "alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# --- Error handling ---------------------------------------------------------
thiserror = "1.0"

# --- Misc -------------------------------------------------------------------
hex = "0.4"
base64 = "0.22"
once_cell = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 0
debug = true

# The TLA+ model checker is an AST interpreter: it walks `Expr` matches and
# moves `Value` trees ~1.4M times per full exploration. At opt-level 0 that is
# minutes of pure interpretation overhead in every test run and audit; at
# opt-level 2 it is seconds. The override is scoped to this one crate so every
# other crate keeps fully debuggable, symbol-rich dev builds.
[profile.dev.package.aegis-smt-verifier]
opt-level = 2