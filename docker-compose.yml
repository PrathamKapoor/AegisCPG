# AegisCPG -- reproducible deployment.
#
# Author: Pratham Kapoor <prathamkapoor027@gmail.com>
# https://github.com/PrathamKapoor
#
# WHAT:  Four services that run the control plane. The Rust verifier and the
#        eBPF loader are built inside the image rather than mounted, so a
#        reviewer can read what is running rather than trusting a tag.
# WHY:   Every service is pinned to a digest-shaped tag, runs read-only, and
#        drops every capability. A security tool that needs to be started with
#        --privileged to work is not one you can hand to an operator.
# HOW:   `docker compose up --build` brings up the whole stack. The proxy waits
#        for the verifier to report healthy, so no request is ever served
#        without a TACR behind it.

name: aegiscpg

services:
  # ---------------------------------------------------------------------------
  # Stage 1-3: the Rust verifier. Builds inside the image from the workspace, so
  # the binary in the container is the binary in the repository.
  # ---------------------------------------------------------------------------
  verifier:
    build:
      context: .
      dockerfile: deploy/Dockerfile.rust
      args:
        AEGIS_PROFILE: release
    image: aegiscpg/verifier:1.0.0
    command: ["aegis-cli", "scan", "--path", "/srv/servers", "--json"]
    volumes:
      - ./benchmarks/fixtures:/srv/servers:ro
    read_only: true
    user: "65534:65534"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    healthcheck:
      # Exit code 0 is "clean", 1 is "violations found". Both mean the tool ran,
      # so the check is for the process being alive, not for a verdict.
      test: ["CMD", "aegis-cli", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: ["aegis-control"]

  # ---------------------------------------------------------------------------
  # Python control plane: divergence, RAG, MILP. Loads the ONNX graph at start.
  # ---------------------------------------------------------------------------
  ml-engine:
    build:
      context: .
      dockerfile: deploy/Dockerfile.python
    image: aegiscpg/ml-engine:1.0.0
    command: ["python", "-m", "aegis_ml.server"]
    environment:
      AEGIS_ML_HOST: "0.0.0.0"
      AEGIS_ML_PORT: "8077"
      # Absolute, so the fixture root is unambiguous regardless of WORKDIR.
      AEGIS_FIXTURE_ROOT: "/srv/fixtures/vulnerable-lab"
      AEGIS_ML_CACHE: "/var/cache/aegis"
      # No LLM runtime is configured, because none is present (ADR-001).
      AEGIS_CLI: "/usr/local/bin/aegis-cli"
    volumes:
      - ./benchmarks/fixtures:/srv/fixtures:ro
      - aegis-model-cache:/var/cache/aegis
    read_only: true
    user: "65534:65534"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    healthcheck:
      # Reports which dense path is active and the model's SHA-256, so a
      # deployment can prove which artefact it is serving.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8077/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: ["aegis-control"]

  # ---------------------------------------------------------------------------
  # The inline edit automaton. The only service that sees tool traffic.
  # ---------------------------------------------------------------------------
  proxy-gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.rust
      args:
        AEGIS_PROFILE: release
    image: aegiscpg/gateway:1.0.0
    command: ["aegis-proxy-gateway", "--listen", "0.0.0.0:8443", "--tls-cert", "/run/aegis/gateway.pem"]
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./benchmarks/fixtures:/srv/servers:ro
      # Read-only: the gateway resolves a TACR, it never mints one.
      - aegis-tacr-store:/var/lib/aegis:ro
    read_only: true
    user: "65534:65534"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    depends_on:
      verifier:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "aegis-proxy-gateway", "--self-test"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: ["aegis-control", "aegis-edge"]

  # ---------------------------------------------------------------------------
  # Stage 4. Needs BPF and a writable /sys/fs/bpf, so it is the one service that
  # is not fully confined. It is separated and marked for that reason.
  # ---------------------------------------------------------------------------
  ebpf-loader:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ebpf
    image: aegiscpg/ebpf-loader:1.0.0
    command: ["aegis-ebpf-loader", "--pin", "/sys/fs/bpf/aegis", "--repo", "/srv/servers"]
    volumes:
      - ./benchmarks/fixtures:/srv/servers:ro
      - /sys/fs/bpf:/sys/fs/bpf
    # CAP_BPF and CAP_PERFMON are required to load an LSM program. This is the
    # documented exception, not an oversight: without them the BPF object is not
    # loaded and the userspace edit automaton carries enforcement alone.
    cap_add: ["CAP_BPF", "CAP_PERFMON", "CAP_SYS_ADMIN"]
    security_opt:
      - no-new-privileges:true
    # Kernel 5.7+ with CONFIG_BPF_LSM and lsm=...,bpf. Without them the loader
    # reports degraded and the reduced guarantee applies (ADR-004).
    profiles: ["kernel-lsm"]
    networks: ["aegis-control"]

networks:
  # Control plane: the verifier, the ML engine and the gateway.
  aegis-control:
    driver: bridge
    internal: true
  # Edge: only the gateway joins. The verifier and the ML engine are unreachable
  # from outside the control network.
  aegis-edge:
    driver: bridge

volumes:
  # The trained ONNX graph, written once on first start.
  aegis-model-cache:
  # TACR documents the gateway resolves against. Read-only for the gateway.
  aegis-tacr-store:
