[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ml-rag"
version = "1.0.0"
description = "AegisCPG zero-LLM hybrid code-graph RAG, semantic divergence classifier, and MILP least-privilege synthesizer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Pratham Kapoor", email = "prathamkapoor027@gmail.com" }]
keywords = [
    "mcp",
    "a2a",
    "static-analysis",
    "formal-verification",
    "code-property-graph",
    "zero-llm",
    "ebpf",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Runtime dependencies are deliberately minimal and every one of them is
# offline-capable. There is no HTTP client dependency and no model-provider
# dependency, because ADR-001 forbids calling an LLM from anywhere in this
# package. BAAI/bge-small-en-v1.5 weights are consumed from a local cache when
# present; otherwise aegis_ml.hybrid_indexer uses a deterministic feature-hashed
# subword projection, which is documented and measured separately rather than
# silently substituted.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-rust>=0.21",
]

[project.optional-dependencies]
bench = ["duckdb>=1.0", "pyarrow>=15.0"]
workflow = ["temporalio>=1.7"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/PrathamKapoor"
Repository = "https://github.com/PrathamKapoor/AegisCPG"

[tool.setuptools]
packages = ["aegis_ml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: benchmarks that execute the full polyglot lab",
    "requires_onnx: tests that need a trained ONNX artefact",
]