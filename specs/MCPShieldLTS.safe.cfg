\* AegisCPG -- TLC configuration for the AEGISCPG-PROTECTED model.
\*
\* Author: Pratham Kapoor <prathamkapoor027@gmail.com>
\* https://github.com/PrathamKapoor
\*
\* WHAT:  Instantiates specs/MCPShieldLTS.tla with GatewayEnforced = TRUE and a
\*        non-empty VerifiedDeclassifications set, i.e. the behaviour of the same
\*        toolchain once the AegisCPG control plane is installed.
\*
\* WHY:   This is the positive counterpart to MCPShieldLTS.cfg. Proving that the
\*        unprotected model violates an invariant shows only that the bug exists.
\*        Proving that the protected model satisfies ALL FOUR invariants shows
\*        that the control plane closes exactly those holes and introduces none.
\*
\* HOW:   Run with:
\*          java -cp tla2tools.jar tlc2.TLC \
\*               -config MCPShieldLTS.safe.cfg MCPShieldLTS.tla
\*
\* EXPECTED RESULT: "Model checking completed. No error has been found."
\* and exit status 0.
\*
\* TLC NOTE: traceLog records every transition, so TLC's state space grows
\* without bound and a full TLC run needs a depth directive. The native
\* checker (aegis-cli check-tla) quotients the trace and terminates exactly:
\* it explores every structurally distinct reachable state (see decisions.md
\* ADR-021 for the bisimulation argument).
\*
\* Two effects of GatewayEnforced = TRUE are exercised here:
\*   1. MutateToolDefinition requires newHash = approvedToolHashes[t], so the
\*      pinned H(def)||H(DTG) pair makes the rug pull (TV5) unreachable.
\*   2. Fido2Declassify requires <<d, s_target>> in VerifiedDeclassifications,
\*      so cross-domain release of a SECRET datum into a PUBLIC server is
\*      possible only with a hardware-verified assertion, and only for the exact
\*      (datum, target) pair that was approved -- never for a different datum.

SPECIFICATION Spec

CONSTANTS
    Agents   = { a_editor, a_attacker }
    Servers  = { s_filesystem, s_markdown, s_slack }
    Tools    = { t_read_env, t_read_doc, t_format, t_webhook_post }
    Resources = { r_dotenv, r_aws_credentials, r_public_readme }

    HashValues = { "H_approved_v1", "H_approved_v2" }

    GatewayEnforced = TRUE

    ServerOf = [ t_read_env     |-> s_filesystem,
                 t_read_doc      |-> s_filesystem,
                 t_format        |-> s_markdown,
                 t_webhook_post  |-> s_slack ]

    ServerClearance = [ s_filesystem |-> 2,
                        s_markdown    |-> 1,
                        s_slack       |-> 0 ]

    ResourceLevel = [ r_dotenv         |-> 3,
                      r_aws_credentials |-> 3,
                      r_public_readme   |-> 0 ]

    ToolReads = [ t_read_env    |-> { r_dotenv, r_aws_credentials },
                  t_read_doc    |-> { r_public_readme },
                  t_format      |-> { r_public_readme },
                  t_webhook_post |-> { r_public_readme } ]

    ToolProduces = [ t_read_env    |-> 3,
                     t_read_doc    |-> 0,
                     t_format      |-> 3,
                     t_webhook_post |-> 3 ]

    ToolPerms = [ t_read_env    |-> { t_read_doc },
                  t_read_doc    |-> { t_read_doc },
                  t_format      |-> { t_format },
                  t_webhook_post |-> { t_webhook_post } ]

    \* Signed TACR capability grants per agent. The attacker may not read the
    \* environment directly; composition is the only path to the secret.
    \* `t_format` is withheld as well: it echoes the document it is handed, so
    \* granting it would let the clearance lattice (not the capability guard)
    \* be the only barrier to an ungranted invocation on public data, making
    \* PrivilegeBoundedness redundantly enforced there. Withholding it keeps
    \* the capability guard load-bearing for that property, which is what the
    \* `AllowUnboundedCapabilityCall` mutation removes (see tla_real_spec.rs).
    ToolGrants = [ a_editor   |-> { t_read_env, t_read_doc, t_format, t_webhook_post },
                   a_attacker |-> { t_read_doc, t_webhook_post } ]

    \* Exactly one declassification was approved with a hardware passkey:
    \* release r_dotenv from s_filesystem into s_markdown. Nothing is approved
    \* for s_slack, so the exfiltration chain terminates at the Slack webhook.
    VerifiedDeclassifications =
        { <<r_dotenv, s_markdown>> }

INVARIANTS
    TypeOK
    ToolIntegrityInvariant
    DataConfinementInvariant
    PrivilegeBoundednessInvariant
    ContextIsolationInvariant
    NoImplicitDeclassification

CHECK_DEADLOCK FALSE