\* AegisCPG -- TLC configuration for the UNPROTECTED (pre-control-plane) model.
\*
\* Author: Pratham Kapoor <prathamkapoor027@gmail.com>
\* https://github.com/PrathamKapoor
\*
\* WHAT:  Instantiates specs/MCPShieldLTS.tla with GatewayEnforced = FALSE,
\*        i.e. the behaviour of an MCP toolchain with no AegisCPG control plane.
\*
\* WHY:   A formal model is only useful if it can FAIL. This configuration is
\*        expected to produce invariant-violating behaviours; each one is a
\*        concrete, replayable attack witness rather than a hand-written claim.
\*
\* HOW:   Run with:
\*          java -cp tla2tools.jar tlc2.TLC -config MCPShieldLTS.cfg MCPShieldLTS.tla
\*
\* EXPECTED RESULT (a violation report is the CORRECT outcome for this file).
\* Each witness below is reproduced with a minimal counterexample trace by
\* `aegis-cli check-tla --spec specs/MCPShieldLTS.tla --config <this file>`
\* and, when a JVM is available, by TLC:
\*   Error: Invariant ToolIntegrityInvariant is violated.
\*     -> witness: MutateToolDefinition rewrites currentToolHashes[t] with a hash
\*        that is not in approvedToolHashes. This is the rug pull, TV5, and the
\*        version rollback, TV6. (Reachable in one transition from Init.)
\*   Error: Invariant DataConfinementInvariant is violated.
\*     -> witness: agentKnowledge[a_editor][s_filesystem] learns level 3 from
\*        the unguarded read of r_dotenv although s_filesystem is cleared only
\*        for CONFIDENTIAL(2). Secret data crossed a clearance boundary with no
\*        declassified flow in place.
\*   Error: Invariant ContextIsolationInvariant is violated.
\*     -> witness: s_filesystem learns level 3 from r_dotenv, s_slack learns
\*        level 3 from t_webhook_post, and no explicit cross-domain flow policy
\*        exists. This is Cross-Server Context Bleed, TV9.

SPECIFICATION Spec

CONSTANTS
    Agents   = { a_editor, a_attacker }
    Servers  = { s_filesystem, s_markdown, s_slack }
    Tools    = { t_read_env, t_read_doc, t_format, t_webhook_post }
    Resources = { r_dotenv, r_aws_credentials, r_public_readme }

    HashValues = { "H_approved_v1", "H_approved_v2", "H_rugpulled_v3" }

    GatewayEnforced = FALSE

    ServerOf = [ t_read_env     |-> s_filesystem,
                 t_read_doc      |-> s_filesystem,
                 t_format        |-> s_markdown,
                 t_webhook_post  |-> s_slack ]

    ServerClearance = [ s_filesystem |-> 2,
                        s_markdown    |-> 1,
                        s_slack       |-> 0 ]

    ResourceLevel = [ r_dotenv         |-> 3,
                      r_aws_credentials |-> 3,
                      r_public_readme   |-> 0 ]

    ToolReads = [ t_read_env    |-> { r_dotenv, r_aws_credentials },
                  t_read_doc    |-> { r_public_readme },
                  t_format      |-> { r_public_readme },
                  t_webhook_post |-> { r_public_readme } ]

    ToolProduces = [ t_read_env    |-> 3,
                     t_read_doc    |-> 0,
                     t_format      |-> 3,
                     t_webhook_post |-> 3 ]

    ToolPerms = [ t_read_env    |-> { t_read_doc },
                  t_read_doc    |-> { t_read_doc },
                  t_format      |-> { t_format },
                  t_webhook_post |-> { t_webhook_post } ]

    \* Signed TACR capability grants per agent. The attacker may not read the
    \* environment directly; composition is the only path to the secret.
    \* `t_format` is withheld as well: it echoes the document it is handed, so
    \* granting it would let the clearance lattice (not the capability guard)
    \* be the only barrier to an ungranted invocation on public data, making
    \* PrivilegeBoundedness redundantly enforced there. Withholding it keeps
    \* the capability guard load-bearing for that property, which is what the
    \* `AllowUnboundedCapabilityCall` mutation removes (see tla_real_spec.rs).
    ToolGrants = [ a_editor   |-> { t_read_env, t_read_doc, t_format, t_webhook_post },
                   a_attacker |-> { t_read_doc, t_webhook_post } ]

    VerifiedDeclassifications = {}

INVARIANTS
    TypeOK
    ToolIntegrityInvariant
    DataConfinementInvariant
    PrivilegeBoundednessInvariant
    ContextIsolationInvariant
    NoImplicitDeclassification

CHECK_DEADLOCK FALSE